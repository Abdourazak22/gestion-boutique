# Les tests utilisent une base dediee : ils ne dependent jamais de ce qui
# traine dans la base de developpement.
spring.datasource.url=jdbc:postgresql://localhost:5432/boutique_test
spring.datasource.username=boutique
spring.datasource.password=boutique

# Le schema vient des migrations Flyway, pas d'Hibernate. C'est volontaire et
# c'est le point important : avec create-drop, Hibernate recreait le schema
# depuis les entites et les migrations n'etaient jamais executees. Une
# migration cassee partait en production sans que rien ne la teste.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Reglages Flyway repris a l'identique du fichier principal. Ce fichier masque
# entierement src/main/resources/application.properties, il ne s'y ajoute pas :
# ce qui n'est pas redit ici n'existe pas pendant les tests. Omettre
# baseline-on-migrate laissait passer une configuration intestable, puisque les
# tests partent d'un schema vide, cas ou le reglage ne sert a rien, alors qu'une
# base existante refuse de demarrer sans lui.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

boutique.jwt.secret=secret-de-test-de-32-octets-minimum-pour-hmac-sha256
boutique.jwt.duree=10m
boutique.jwt.emetteur=boutique-api-test

boutique.identite.nom=BOUTIQUE TEST
boutique.identite.adresse=Zone de test
boutique.identite.telephone=+226 00 00 00 00
boutique.identite.devise=FCFA

# BCrypt au cout minimal : les tests enchainent les connexions, un cout de 12
# ajouterait plusieurs secondes sans rien prouver de plus.
boutique.securite.bcrypt-force=10
boutique.securite.origines-autorisees=http://localhost:3000
boutique.securite.documentation-publique=true
boutique.securite.max-tentatives=5
boutique.securite.duree-blocage=15m
