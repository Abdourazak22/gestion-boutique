# Profil production : lancer avec --spring.profiles.active=prod
#
# Variables d'environnement obligatoires :
#   BOUTIQUE_JWT_SECRET  secret HMAC, 32 octets minimum, genere aleatoirement
#   DB_URL / DB_USER / DB_PASSWORD
#   CORS_ORIGINES        origines du frontend, separees par des virgules
#
# VerificationProduction refuse le demarrage si le secret de developpement est
# encore en place, si la documentation est publique, ou si une origine CORS
# pointe sur localhost.

# Hibernate ne doit jamais modifier le schema en production : il le valide
# contre les migrations appliquees et echoue si l'ecart est reel.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=false

# Swagger et /v3/api-docs fermes : inutile d'offrir la carte de l'API.
boutique.securite.documentation-publique=false

# Derriere un reverse proxy TLS : respecter X-Forwarded-* pour que les URL
# generees et les redirections restent en https.
server.forward-headers-strategy=framework

# Pas de detail technique dans les reponses d'erreur.
server.error.include-stacktrace=never
server.error.include-message=never

# Les traces SQL ne doivent pas finir dans les logs de production.
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
