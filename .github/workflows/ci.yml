name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permet de relancer la vérification à la main depuis l'onglet Actions.
  workflow_dispatch:

# Un nouveau push sur la même branche annule la vérification en cours : inutile
# de payer pour un commit déjà dépassé.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Les deux projets vivent dans ce dépôt unique. Un seul fichier de workflow, car
# GitHub ne lit que .github/workflows à la racine : les fichiers laissés dans
# backend/ ou frontend/ ne seraient jamais exécutés. Deux jobs plutôt qu'un, pour
# qu'un échec désigne tout de suite le côté fautif, et parce qu'ils tournent en
# parallèle.
jobs:

  backend:
    name: Backend · tests et compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # Les tests tournent sur un vrai PostgreSQL, comme en local : le projet
    # utilise du JPQL et des agrégations SQL qu'une base en mémoire ne
    # reproduirait pas fidèlement. Les identifiants reprennent ceux de
    # backend/src/test/resources/application.properties.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: boutique
          POSTGRES_PASSWORD: boutique
          POSTGRES_DB: boutique_test
        ports:
          - 5432:5432
        # Sans ce contrôle de santé, le job démarre avant que la base accepte
        # les connexions et les tests échouent au hasard.
        options: >-
          --health-cmd "pg_isready -U boutique -d boutique_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          # Met en cache ~/.m2 : sans lui, chaque exécution retelecharge
          # l'intégralité des dépendances Spring. Le chemin est explicite, le
          # pom n'étant plus à la racine du dépôt.
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Lancer la suite de tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Conserver les rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend · types, lint, tests et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    # `lib/api.ts` jette au chargement du module si l'URL de l'API manque, et
    # `next build` prérend les pages : sans ces variables le build échoue. Le
    # `.env` local n'est pas versionné, on fournit donc des valeurs factices,
    # suffisantes puisque aucune requête n'est émise à la compilation.
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_API_TIMEOUT: '10000'
      API_URL: http://localhost:8080/api

    steps:
      - uses: actions/checkout@v5

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` et non `npm install` : il installe exactement le
      # package-lock.json et échoue s'il a dérivé du package.json.
      - name: Installer les dépendances
        run: npm ci

      # `LayoutProps`, `PageProps` et `next-env.d.ts` sont générés par Next, pas
      # versionnés. Sans cette étape, `tsc` ne les trouve pas sur un dépôt frais
      # et échoue alors qu'il passe en local, où un build précédent les a créés.
      - name: Générer les types de routes
        run: npx next typegen

      - name: Vérifier les types
        run: npx tsc --noEmit

      - name: Analyser le code
        run: npm run lint

      - name: Lancer les tests
        run: npm test

      - name: Construire l'application
        run: npm run build
