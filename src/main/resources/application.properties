spring.application.name=backend

# --- Base de donnees ---
# Identifiants surchargeables par variables d'environnement : rien de sensible
# ne doit rester en dur dans un fichier versionne.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/boutique}
spring.datasource.username=${DB_USER:boutique}
spring.datasource.password=${DB_PASSWORD:boutique}

# --- JPA / Hibernate ---
# validate et non update : le schema appartient desormais aux migrations
# Flyway. Hibernate se contente de verifier que les entites correspondent au
# schema en place, et echoue au demarrage si l'ecart est reel. Une evolution
# d'entite sans migration correspondante ne demarre donc plus, au lieu de
# modifier la base en silence.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Migrations de schema ---
# Le schema est decrit par src/main/resources/db/migration, plus par Hibernate.
#
# baseline-on-migrate : la base en service existait avant Flyway. A la premiere
# execution, Flyway la marque comme deja au niveau V1 plutot que de rejouer le
# schema de reference sur des tables qui existent deja. Sur une base vide (CI,
# tests), V1 s'applique normalement : les deux cas aboutissent au meme schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# --- JWT ---
# A surcharger OBLIGATOIREMENT par BOUTIQUE_JWT_SECRET en production : le profil
# prod refuse de demarrer si cette valeur par defaut est encore active.
boutique.jwt.secret=${BOUTIQUE_JWT_SECRET:changer-cette-cle-de-developpement-de-32-octets-minimum}
boutique.jwt.duree=2h
boutique.jwt.emetteur=boutique-api

# --- Securite ---
boutique.securite.origines-autorisees=${CORS_ORIGINES:http://localhost:3000,http://localhost:5173}
boutique.securite.documentation-publique=true
boutique.securite.bcrypt-force=12
boutique.securite.max-tentatives=5
boutique.securite.duree-blocage=15m

# --- Identite imprimee sur le ticket de caisse ---
# Valeurs de remplacement : renseigner l'adresse et le numero reels de la
# boutique avant toute mise en service, ils figurent sur chaque ticket remis
# au client.
boutique.identite.nom=BoutiqueX
boutique.identite.adresse=Ouagadougou
boutique.identite.telephone=+226 25 00 00 00
boutique.identite.devise=FCFA
