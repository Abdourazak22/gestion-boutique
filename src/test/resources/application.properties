# Les tests utilisent une base dediee, recreee a chaque execution : ils ne
# dependent donc jamais de ce qui traine dans la base de developpement.
spring.datasource.url=jdbc:postgresql://localhost:5432/boutique_test
spring.datasource.username=boutique
spring.datasource.password=boutique

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

boutique.jwt.secret=secret-de-test-de-32-octets-minimum-pour-hmac-sha256
boutique.jwt.duree=10m
boutique.jwt.emetteur=boutique-api-test

boutique.identite.nom=BOUTIQUE TEST
boutique.identite.adresse=Zone de test
boutique.identite.telephone=+226 00 00 00 00
boutique.identite.devise=FCFA

# BCrypt au cout minimal : les tests enchainent les connexions, un cout de 12
# ajouterait plusieurs secondes sans rien prouver de plus.
boutique.securite.bcrypt-force=10
boutique.securite.origines-autorisees=http://localhost:3000
boutique.securite.documentation-publique=true
boutique.securite.max-tentatives=5
boutique.securite.duree-blocage=15m
